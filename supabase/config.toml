
[functions.appointment-cron]
enabled = true
verify_jwt = false
import_map = "./functions/appointment-cron/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/appointment-cron/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/appointment-cron/*.html" ]

[functions.stream-token]
enabled = true
verify_jwt = false
import_map = "./functions/stream-token/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/stream-token/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/stream-token/*.html" ]

[functions.consultation-stream-token]
enabled = true
# The handler verifies the bearer token with Supabase Auth getUser.
verify_jwt = false
entrypoint = "./functions/consultation-stream-token/index.ts"
